# 用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen generate
name: EarTranslate
options:
  bundleIdPrefix: com.coolkop123
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
targets:
  EarTranslate:
    type: application
    platform: iOS
    sources: [EarTranslate]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coolkop123.suishen
        PRODUCT_NAME: EarTranslate
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: 酷天同声
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 需要使用麦克风（包括蓝牙耳机麦克风）收听要翻译的语音。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 需要语音识别把说的话转成文字再翻译。
        INFOPLIST_KEY_NSCameraUsageDescription: 需要使用相机拍下文字进行翻译，照片只在手机上处理。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: EarTranslate/Info.plist
      properties:
        UIBackgroundModes: [audio]
